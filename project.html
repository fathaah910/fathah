<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects | FATHAH V</title>
    <meta name="description" content="All projects by Abdul Fathah — filterable gallery with the same design as the homepage." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Devicon (tech logos) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css" />

    <!-- Tailwind (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] } } }, darkMode: 'class' };
    </script>

    <style>
      :root{ --accent-h:38; --accent-s:92%; --accent-l:50%; --accent: var(--accent-h) var(--accent-s) var(--accent-l) }
      .accent-bg{ background-color:hsl(var(--accent)) }
      .accent{ color:hsl(var(--accent)) }
      .accent-border{ border-color:hsl(var(--accent)) }
      .focus-ring:focus-visible { outline: none; box-shadow: 0 0 0 4px hsl(var(--accent) / .25); }
      .card-hover{ transition: box-shadow .2s, transform .2s }
      .card-hover:hover{ transform: translateY(-2px) }
      ::-webkit-scrollbar { width: 10px; height: 10px }
      ::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 999px }
      html.dark ::-webkit-scrollbar-thumb { background: #3f3f46 }
    </style>
  </head>

  <body class="bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 antialiased">
    <a href="#main" class="sr-only focus:not-sr-only focus-ring absolute left-3 top-3 z-50 rounded-lg bg-white/90 px-3 py-2 text-sm shadow dark:bg-zinc-800/90">Skip to content</a>

    <!-- NAVBAR -->
    <header class="sticky top-0 z-40 px-4 py-3">
      <div class="mx-auto max-w-6xl">
        <div class="rounded-full border border-zinc-200/80 bg-white/90 px-4 shadow-sm backdrop-blur dark:border-zinc-700/60 dark:bg-zinc-900/80">
          <div class="flex h-14 items-center justify-between">
            <a href="/" class="flex items-center gap-3 group">
              <span aria-hidden class="h-8 w-8 rounded-xl accent-bg shadow-sm"></span>
              <span class="font-semibold tracking-tight group-hover:opacity-80">FATHAH</span>
            </a>
            <nav aria-label="Primary" class="hidden gap-6 md:flex">
              <a href="/" class="hover:opacity-80"></a>
              <a href="#all" class="hover:opacity-80">Projects</a>
              <a href="/?admin" class="hover:opacity-80"></a>
            </nav>
            <div class="flex items-center gap-2">
              <button id="themeToggle" class="focus-ring relative inline-flex h-9 w-9 items-center justify-center rounded-full border border-zinc-200 bg-white shadow-[inset_0_1px_1px_rgba(0,0,0,0.04)] hover:bg-zinc-50 dark:border-zinc-700/80 dark:bg-zinc-900 dark:hover:bg-zinc-800" aria-label="Toggle dark mode">
                <svg id="moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-5 w-5"><path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3c.2 0 .4.12.48.31a.5.5 0 0 1-.12.56a7 7 0 0 0 8.56 8.56a.5.5 0 0 1 .56-.12c.19.08.31.28.31.48"/></svg>
                <svg id="sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="absolute hidden h-5 w-5"><path fill="currentColor" d="M12 18a6 6 0 1 0 0-12a6 6 0 0 0 0 12m0 4a1 1 0 0 1-1-1v-1a1 1 0 1 1 2 0v1a1 1 0 0 1-1 1m0-18a1 1 0 0 1-1-1V2a1 1 0 1 1 2 0v1a1 1 0 0 1-1 1m10 9a1 1 0 0 1-1-1h-1a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1m-18 0a1 1 0 0 1-1-1H2a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1m15.07 7.07a1 1 0 0 1-1.41 0l-.71-.71a1 1 0 1 1 1.41-1.41l.71.71a1 1 0 0 1 0 1.41M6.05 6.05A1 1 0 0 1 7.46 7.46l-.71.71a1 1 0 1 1-1.41-1.41zm12.02-2.12a1 1 0 1 1 1.41 1.41l-.71.71a1 1 0 1 1-1.41-1.41zM4.23 18.36a1 1 0 0 1 1.41-1.41l.71.71a1 1 0 0 1-1.41 1.41z"/></svg>
              </button>
              <a href="/" class=" md:inline-flex focus-ring items-center gap-2 rounded-full border border-zinc-200 bg-white px-3 py-2 text-sm font-medium shadow-[inset_0_1px_1px_rgba(0,0,0,0.04)] hover:bg-zinc-50 dark:border-zinc-700/80 dark:bg-zinc-900 dark:hover:bg-zinc-800">home</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main id="main" class="relative">
      <!-- Animated background dots (same as index) -->
      <canvas id="bgDots" class="pointer-events-none fixed inset-0 -z-10"></canvas>

      <section class="mx-auto max-w-6xl px-4 pt-16 pb-8">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <h1 class="text-3xl font-extrabold tracking-tight">All Projects</h1>
            <p class="mt-1 text-sm text-zinc-600 dark:text-zinc-300">Everything from small sites to full-stack apps.</p>
          </div>
          <div class="flex items-center gap-2">
            <input id="filterInput" placeholder="Search title or tech…" class="w-56 rounded-xl border border-zinc-300 bg-white px-3 py-2 text-sm shadow-sm dark:border-zinc-700 dark:bg-zinc-900" />
            <button id="clearFilter" class="rounded-xl border border-zinc-200 px-3 py-2 text-sm hover:bg-zinc-50 dark:border-zinc-700 dark:hover:bg-zinc-800">Clear</button>
          </div>
        </div>
      </section>

      <section id="all" class="mx-auto max-w-6xl px-4 pb-20">
        <div id="projectsGridAll" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
        <div id="emptyState" class="hidden mt-10 rounded-2xl border border-zinc-200 bg-white p-6 text-center text-sm text-zinc-600 dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-300">No projects match your search.</div>
      </section>

      <section id="adminView" class="mx-auto hidden max-w-6xl px-4 py-16 border-t border-zinc-200 dark:border-zinc-800"></section>
    </main>

    <footer class="mx-auto max-w-6xl px-4 py-10 text-sm text-zinc-600 dark:text-zinc-400">
      <div class="flex flex-wrap items-center justify-between gap-3 border-t border-zinc-200 pt-6 dark:border-zinc-800">
        <p>© <span id="year"></span> FATHAH. All rights reserved.</p>
        <div class="flex items-center gap-4">
          <a class="hover:opacity-80" href="/">Home</a>
          <a class="hover:opacity-80" href="/?admin">Admin</a>
        </div>
      </div>
    </footer>

    <script>
      // Year + theme
      document.getElementById('year').textContent = new Date().getFullYear();
      const html = document.documentElement, themeToggle = document.getElementById('themeToggle'), sun=document.getElementById('sun'), moon=document.getElementById('moon');
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme==='dark' || (!savedTheme && matchMedia('(prefers-color-scheme: dark)').matches)) html.classList.add('dark');
      function updateThemeIcon(){ const d=html.classList.contains('dark'); sun?.classList.toggle('hidden', !d); moon?.classList.toggle('hidden', d); }
      updateThemeIcon();
      themeToggle?.addEventListener('click',()=>{ html.classList.toggle('dark'); localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light'); updateThemeIcon(); });

      // ===== Animated background dots (same as index) =====
      const canvas = document.getElementById('bgDots');
      const ctx = canvas.getContext('2d'); let w, h;
      function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
      resize(); window.addEventListener('resize', resize);
      const dots = Array.from({length: 60}, () => ({
        x: Math.random()*w, y: Math.random()*h, r: 3+Math.random()*4,
        dx:(Math.random()-.5)*0.3, dy:(Math.random()-.5)*0.3,
        color: `hsla(${200 + Math.random()*80},70%,60%,0.6)`
      }));
      function animate(){
        ctx.clearRect(0,0,w,h);
        for(const d of dots){
          ctx.beginPath(); ctx.fillStyle=d.color; ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill();
          d.x+=d.dx; d.y+=d.dy;
          if(d.x<0||d.x>w) d.dx*=-1;
          if(d.y<0||d.y>h) d.dy*=-1;
        }
        requestAnimationFrame(animate);
      }
      animate();

      // ===== Project data (shared with index via localStorage) =====
      const KEY='portfolioProjects';
      const DEFAULTS=[
        { id: crypto.randomUUID(), title:'SaaS Dashboard', desc:'Analytics, billing, and auth in one place.', tech:['Next.js','Tailwind'], image:'', link:'#', featured:true },
        { id: crypto.randomUUID(), title:'E-commerce', desc:'Headless storefront with blazing performance.', tech:['Remix','Stripe'], image:'', link:'#', featured:true },
        { id: crypto.randomUUID(), title:'Mobile App', desc:'React Native app with offline sync.', tech:['React Native','SQLite'], image:'', link:'#', featured:true }
      ];
      const load = () => { try{ const raw=localStorage.getItem(KEY); if(!raw){ localStorage.setItem(KEY, JSON.stringify(DEFAULTS)); return DEFAULTS; } const json=JSON.parse(raw); return Array.isArray(json) ? json.map(p=>({ featured:false, ...p })) : DEFAULTS; } catch{ localStorage.setItem(KEY, JSON.stringify(DEFAULTS)); return DEFAULTS; } };

      function cardHTML(p){
        return `
        <article class="group rounded-2xl border border-zinc-200 bg-white p-4 shadow-sm transition card-hover hover:shadow-md dark:border-zinc-800 dark:bg-zinc-900">
          ${p.image ? `<a href="${p.link||'#'}" target="_blank" rel="noreferrer" class="block aspect-[16/10] overflow-hidden rounded-xl bg-zinc-100 dark:bg-zinc-800"><img src="${p.image}" alt="${p.title}" class="h-full w-full object-cover"/></a>` : `<div class="aspect-[16/10] rounded-xl bg-zinc-100 dark:bg-zinc-800"></div>`}
          <div class="mt-4 flex items-start justify-between gap-3">
            <div>
              <h3 class="font-semibold tracking-tight">${p.title}</h3>
              <p class="text-sm text-zinc-600 dark:text-zinc-400">${p.desc||''}</p>
            </div>
            ${p.featured ? '<span title="Featured on home" class="inline-flex h-6 shrink-0 items-center justify-center rounded-md bg-amber-100 px-2 text-[11px] font-medium text-amber-800 dark:bg-amber-900/30 dark:text-amber-300">★</span>' : ''}
          </div>
          <div class="mt-3 flex flex-wrap items-center gap-2 text-xs text-zinc-600 dark:text-zinc-400">${(p.tech||[]).map(t=>`<span class="rounded-full bg-zinc-100 px-2 py-1 dark:bg-zinc-800">${t}</span>`).join('')}</div>
        </article>`;
      }

      const gridAll = document.getElementById('projectsGridAll');
      const filterInput = document.getElementById('filterInput');
      const emptyState = document.getElementById('emptyState');
      const clearFilter = document.getElementById('clearFilter');

      function renderAll(){
        const q = (filterInput.value || '').toLowerCase().trim();
        const list = load();
        const filtered = q ? list.filter(p => `${p.title} ${(p.tech||[]).join(' ')}`.toLowerCase().includes(q)) : list;
        gridAll.innerHTML = filtered.map(cardHTML).join('');
        emptyState.classList.toggle('hidden', filtered.length>0);
      }
      filterInput?.addEventListener('input', renderAll);
      clearFilter?.addEventListener('click', ()=>{ filterInput.value=''; renderAll(); filterInput.focus(); });

      // Admin hint
      const isAdmin = new URLSearchParams(location.search).has('admin') || location.hash === '#admin';
      if(isAdmin){
        const wrap=document.getElementById('adminView');
        wrap.innerHTML = `<div class="rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm dark:border-zinc-800 dark:bg-zinc-900"><p class="text-sm">For full admin, <a class="underline" href="/?admin">open the admin on Home</a>. This page mirrors your edits automatically.</p></div>`;
        wrap.classList.remove('hidden');
      }

      renderAll();
      window.addEventListener('storage', (e)=>{ if(e.key===KEY) renderAll(); });
    </script>
  </body>
</html>
